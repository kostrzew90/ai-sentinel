[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sentinel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "httpx==0.28.1",
    "pypdf==7.1.1",
    "pyyaml==6.0.4",
    "python-multipart==0.0.34",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "reportlab==5.1.1"]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
